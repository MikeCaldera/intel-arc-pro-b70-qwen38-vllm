<text x="110" y="866" fill="#68a7ff" font-size="15" font-weight="600">+38% vs no-spec@150W</text>

<line x1="382" y1="756" x2="382" y2="866" stroke="#263a53" stroke-width="2"/>

<text x="410" y="776" fill="#9caec4" font-size="16" font-weight="600">p8192/g128</text>

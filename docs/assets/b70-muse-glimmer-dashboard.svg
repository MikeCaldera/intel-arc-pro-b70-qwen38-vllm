<!-- P1 Callout -->
<text x="750" y="348" fill="#f5f8fc" font-size="20" font-weight="600">The missing flag: GGML_SYCL_F16=ON</text>
<text x="750" y="378" fill="#9caec4" font-size="17" font-weight="500">The SAME build WITHOUT `GGML_SYCL_F16=ON` measured pp4096 = 293 t/s.</text>
<text x="750" y="400" fill="#9caec4" font-size="17" font-weight="500">The flag was the entire 3.4× prefill gap.</text>

<text x="750" y="460" fill="#f5f8fc" font-size="16" font-weight="600">Before (No F16 flag)</text>
<rect x="950" y="442" width="90" height="24" rx="4" fill="#ffb45c"/>
<text x="1055" y="460" fill="#ffb45c" font-size="18" font-weight="700">293 t/s</text>

<text x="750" y="505" fill="#f5f8fc" font-size="16" font-weight="600">After (F16 flag ON)</text>
<rect x="950" y="487" width="400" height="24" rx="4" fill="#55d6be"/>
<text x="1365" y="505" fill="#55d6be" font-size="18" font-weight="700">+344% (1,301 t/s)</text>


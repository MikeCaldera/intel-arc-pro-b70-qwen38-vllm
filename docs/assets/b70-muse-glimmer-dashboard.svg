<!-- Footer -->
<text x="48" y="1380" fill="#f5f8fc" font-size="14" font-weight="700">E2 provisional · self-reported, not independently reproduced</text>
<text x="48" y="1405" fill="#9caec4" font-size="14" font-weight="500">Timing source labels: prefill = llama-bench pp (engine); decode = C1 engine timings.predicted_per_second (llama-server HTTP); never mix.</text>
<text x="48" y="1430" fill="#9caec4" font-size="14" font-weight="500">Config: -ngl 99 -ncmoe 0 -fa on -ctk q8_0 -ctv q4_1 -t 8 -b 8192 -ub 8192 --spec-type draft-dflash --spec-draft-n-max 2</text>
<text x="48" y="1455" fill="#9caec4" font-size="14" font-weight="500">Evidence: docs/benchmark-history.md Run 33 + Run 34; results/muse-glimmer-q4kxl-dflash-20260810T143831-2493876/</text>
<text x="48" y="1480" fill="#9caec4" font-size="14" font-weight="500">Notes: 128K ctx untested (VRAM-gated); vision + reasoning + DFlash verified working.</text>

<text x="48" y="1520" fill="#6b7a90" font-size="12" font-weight="500">vLLM blocked on B70: RedHatAI FP8-block = 34.4 GB (no fit on 32 GB); XPU has no FP8 linear kernel (PlatformEnum.XPU KeyError); no GPTQ-INT4 exists — llama.cpp GGUF is the only path.</text>

</svg>

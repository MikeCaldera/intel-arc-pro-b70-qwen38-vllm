<!-- Footer -->
<text x="58" y="1350" fill="#ffb45c" font-size="14" font-weight="600">⚠️ E2 provisional · self-reported, not independently reproduced.</text>
<text x="58" y="1375" fill="#9caec4" font-size="14">Timing labels: decode = engine timings.predicted_per_second (llama-server HTTP, C1 cold, unique entropy-first exact prompts); prefill = llama-bench pp. Never merge.</text>
<text x="58" y="1400" fill="#9caec4" font-size="14">Config: -ngl 99 -ncmoe 0 -fa on -ctk q8_0 -ctv q4_1 -t 8 -b 8192 -ub 8192 -c 131072 --parallel 1 --spec-type draft-dflash --spec-draft-n-max 2</text>
<text x="58" y="1425" fill="#9caec4" font-size="14">Evidence: benchmark-history.md Run 33/34/35; results/muse-dflash-sweep-manual-20260810T164735/</text>
<text x="58" y="1450" fill="#6c8098" font-size="14">vLLM/FP8 status: blocked on B70 (FP8-block = 34.4 GB, no XPU FP8 linear kernel, no GPTQ-INT4). llama.cpp GGUF is the only working path.</text>
<text x="58" y="1475" fill="#9caec4" font-size="14">Quality caveat: reasoning model — decode includes reasoning_content tokens; speed ≠ output-quality parity (reference check pending).</text>


<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1580" viewBox="0 0 1600 1580" role="img" aria-labelledby="title desc">
<title id="title">Muse-Glimmer-30B B70 Benchmark Dashboard</title>
<desc id="desc">Dashboard showing prefill, decode, and power scaling for Muse-Glimmer-30B on Intel Arc Pro B70 using llama.cpp SYCL.</desc>
<rect width="1600" height="1580" fill="#07111f"/>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}</style>

<!-- Header -->
<text x="48" y="64" fill="#55d6be" font-size="18" font-weight="800" text-anchor="start">MUSE-GLIMMER-30B · Q4_K_XL · LLAMA.CPP SYCL · C1 · FIRST B70 RUN</text>
<text x="48" y="112" fill="#f5f8fc" font-size="39" font-weight="750" text-anchor="start">Prefill fixed by a build flag: 1,301 t/s pp4096</text>
<text x="48" y="148" fill="#9caec4" font-size="19" font-weight="500" text-anchor="start">Intel Arc Pro B70 32GB · llama.cpp master d2f83055d (284) · SYCL IntelLLVM 2026.0 · Q4_K_XL 14.78 GiB · 27.85B text params · q8_0/q4_1 KV · 64K ctx</text>


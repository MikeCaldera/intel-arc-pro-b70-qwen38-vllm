<text x="410" y="866" fill="#68a7ff" font-size="15" font-weight="600">+48% vs no-spec@150W</text>

<!-- P2 Right: Tuning Screen -->
<text x="750" y="766" fill="#f5f8fc" font-size="20" font-weight="600">Tuning screen (pre-F16 build, relative ranking)</text>
<rect x="750" y="786" width="700" height="44" rx="12" fill="#0b1829"/>
<text x="780" y="814" fill="#55d6be" font-size="18" font-weight="700">DFlash n_max=2</text>
<text x="940" y="814" fill="#9caec4" font-size="18" font-weight="700">&gt;</text>
<text x="980" y="814" fill="#f5f8fc" font-size="18" font-weight="600">n_max=3</text>
<text x="1070" y="814" fill="#9caec4" font-size="18" font-weight="700">&gt;</text>
<text x="1110" y="814" fill="#f5f8fc" font-size="18" font-weight="600">no-spec</text>
<text x="1200" y="814" fill="#9caec4" font-size="18" font-weight="700">&gt;</text>
<text x="1240" y="814" fill="#ffb45c" font-size="18" font-weight="600">n_max=15</text>
<text x="750" y="860" fill="#9caec4" font-size="16" font-weight="500">Lesson: n_max=15 collapses performance.</text>
<text x="750" y="880" fill="#9caec4" font-size="16" font-weight="500">Acceptance drops to 0.18–0.45, mean accepted length only 3.4–6.7.</text>


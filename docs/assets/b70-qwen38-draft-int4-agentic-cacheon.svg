<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-27B prefix-on agentic: cookbook BF16 draft vs draft-INT4 S+M1</title>
<desc id="desc">C1 client post-first medians with prefix caching on. Isolated C1 after-load VRAM. Not mixed with cache-off agentic or the 83.7 LMX row. E2 self-reported.</desc>
<rect width="1600" height="900" fill="#07111f"/>
<style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
<text x="58" y="54" fill="#55d6be" font-size="16" font-weight="800" text-anchor="start">QWEN3.8-27B · PREFIX CACHE ON · AGENTIC C1 · 1× B70</text>
<text x="58" y="98" fill="#f5f8fc" font-size="34" font-weight="750" text-anchor="start">INT4 draft beat BF16 draft on real coding sessions</text>
<text x="58" y="134" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start">vLLM 0.27.2rc1.dev77+gac7509e2b · MTP4 · 230 W cap · client post-first · matched_except_quant · E2</text>
<rect x="48" y="168" width="1504" height="430" rx="28" fill="#0f1d30"/>
<text x="82" y="212" fill="#55d6be" font-size="15" font-weight="700" text-anchor="start">CLIENT POST-FIRST tok/s, MEDIAN</text>
<text x="980" y="212" fill="#68a7ff" font-size="15" font-weight="600" text-anchor="start">Blue = cookbook BF16 draft</text>
<text x="1260" y="212" fill="#ffb45c" font-size="15" font-weight="600" text-anchor="start">Orange = INT4 draft S+M1</text>
<text x="82" y="268" fill="#9caec4" font-size="18" font-weight="600" text-anchor="start">short coding 3×5 g256, 15 turns</text>
<rect x="82" y="282" width="520" height="22" rx="8" fill="#0b1829"/><rect x="82" y="282" width="284.8" height="22" rx="8" fill="#68a7ff" opacity="0.85"/>
<text x="620" y="300" fill="#f5f8fc" font-size="18" font-weight="600" text-anchor="start">43.81 tok/s</text>
<rect x="780" y="282" width="520" height="22" rx="8" fill="#0b1829"/><rect x="780" y="282" width="382.6" height="22" rx="8" fill="#ffb45c" opacity="0.85"/>
<text x="1320" y="300" fill="#f5f8fc" font-size="18" font-weight="700" text-anchor="start">58.86  +34.4%</text>
<text x="82" y="378" fill="#9caec4" font-size="18" font-weight="600" text-anchor="start">8K session g128, 15 turns</text>
<rect x="82" y="392" width="520" height="22" rx="8" fill="#0b1829"/><rect x="82" y="392" width="312.3" height="22" rx="8" fill="#68a7ff" opacity="0.85"/>
<text x="620" y="410" fill="#f5f8fc" font-size="18" font-weight="600" text-anchor="start">48.04 tok/s</text>
<rect x="780" y="392" width="520" height="22" rx="8" fill="#0b1829"/><rect x="780" y="392" width="435.4" height="22" rx="8" fill="#ffb45c" opacity="0.85"/>
<text x="1320" y="410" fill="#f5f8fc" font-size="18" font-weight="700" text-anchor="start">66.99  +39.4%</text>
<text x="82" y="488" fill="#9caec4" font-size="18" font-weight="600" text-anchor="start">16K session g128, 8 turns (2 sessions)</text>
<rect x="82" y="502" width="520" height="22" rx="8" fill="#0b1829"/><rect x="82" y="502" width="353.6" height="22" rx="8" fill="#68a7ff" opacity="0.85"/>
<text x="620" y="520" fill="#f5f8fc" font-size="18" font-weight="600" text-anchor="start">54.40 tok/s</text>
<rect x="780" y="502" width="520" height="22" rx="8" fill="#0b1829"/><rect x="780" y="502" width="428.5" height="22" rx="8" fill="#ffb45c" opacity="0.85"/>
<text x="1320" y="520" fill="#f5f8fc" font-size="18" font-weight="700" text-anchor="start">65.92  +21.2%</text>
<rect x="48" y="620" width="1504" height="236" rx="28" fill="#0f1d30"/>
<text x="82" y="664" fill="#55d6be" font-size="15" font-weight="700" text-anchor="start">LABELS</text>
<text x="82" y="704" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start">Prefix cache on (server logs). Short t1 hits=0; t5 hits=1664. Long t2+ hits 4992–18304.</text>
<text x="82" y="738" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start">After-load 865 / 871 MiB — isolated C1, not a serving-capacity claim.</text>
<text x="82" y="772" fill="#ff7a7a" font-size="16" font-weight="600" text-anchor="start">Do not mix with cache-off agentic (43.27 / 57.45). Prefix cache did not make decode faster.</text>
<text x="82" y="806" fill="#f5f8fc" font-size="16" font-weight="600" text-anchor="start">Do not overwrite LMX 83.7. Synthetic cache-off overlay remains 112.65 vs 81.20.</text>
</svg>

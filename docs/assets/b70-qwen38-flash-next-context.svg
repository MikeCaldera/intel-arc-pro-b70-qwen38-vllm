<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-Flash-Next C1 prefill and decode from 8K to 128K context</title>
<desc id="desc">Grouped bar charts, y-axis from zero. Prefill: 8K is p512 only (F16 191.55, FP32 183.17). 16K p9096 peaks (F16 593.98, FP32 478.71) then 128K falls (F16 398.02, FP32 353.95). Decode p512/g128 stays 22.96 to 23.54 tok/s from 8K to 128K. C1 llama.cpp SYCL on two Intel Arc Pro B70 GPUs. n=3 screens. 8K, 16K, and 128K are context windows.</desc>
<rect width="1600" height="1280" fill="#07111f"/>
<text x="56" y="52" fill="#55d6be" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">QWEN3.8-FLASH-NEXT · 2× INTEL ARC PRO B70 · llama.cpp SYCL</text>
<text x="56" y="100" fill="#f5f8fc" font-size="34" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">How speed changes with context</text>
<text x="56" y="136" fill="#9caec4" font-size="17" font-family="ui-sans-serif, system-ui, sans-serif">Single request (C1) · 8K → 16K → 128K context windows · y-axis starts at 0</text>


<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-Flash-Next C1 decode and prefill scaling from 8K to 128K context</title>
<desc id="desc">Provisional n=3 C1 screens on two Intel Arc Pro B70 GPUs. Context windows c8, c16, and c128, not concurrency. Prefill: p512 cold input stays about 183-196 tok/s from 8K to 128K; actual-p9096 cold input peaks at 16K (F16 593.98, FP32 478.71) then falls at 128K (F16 398.02, FP32 353.95). Decode: p512/g128 stays about 23 tok/s from 8K to 128K; p9096/g128 stays about 20.3 tok/s at 16K and 128K. 8K cannot hold a 9096-token prompt. Not n=5 ranking cells.</desc>

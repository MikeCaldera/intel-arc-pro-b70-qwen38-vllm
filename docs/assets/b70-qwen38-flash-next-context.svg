<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-Flash-Next C1 context scaling on two Intel Arc Pro B70 GPUs</title>
<desc id="desc">Provisional n=3 C1 screens. c8, c16, and c128 are context windows. Fused F16 16K actual-p9096 cold input 593.98; fused FP32 16K 478.71; 128K F16 398.02 and FP32 353.95. p512 decode stays about 23 tok/s across 8K to 128K. Not n=5 ranking cells.</desc>
<rect width="1600" height="1100" fill="#07111f"/>
<text x="48" y="48" fill="#55d6be" font-size="16" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">QWEN3.8-FLASH-NEXT · CONTEXT WINDOWS · C1 n=3 PROVISIONAL</text>
<text x="48" y="94" fill="#f5f8fc" font-size="32" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">c8 / c16 / c128 are context, not concurrency</text>
<text x="48" y="128" fill="#9caec4" font-size="17" font-weight="400" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Overnight screens · one discarded warmup · not ranking cells · 128K uses -b/-ub 1024</text>
<rect x="1220" y="28" width="332" height="88" rx="18" fill="#0f1d30"/>
<text x="1386" y="64" fill="#ffb45c" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">PROVISIONAL n=3</text>
<text x="1386" y="94" fill="#9caec4" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">not the n=5 catalog rows</text>

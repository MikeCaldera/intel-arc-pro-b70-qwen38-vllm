<text x="48" y="94" fill="#f5f8fc" font-size="32" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Decode and prefill vs context</text>
<text x="48" y="128" fill="#9caec4" font-size="17" font-weight="400" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Low 8K → 16K → maximum 128K · c8/c16/c128 are context windows, not concurrency · n=3 provisional</text>

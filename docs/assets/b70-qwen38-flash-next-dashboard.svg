<text x="850" y="206" fill="#55d6be" font-size="15" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">PREFILL-FIRST · FUSED F16 · 16K CONTEXT</text>
<text x="850" y="246" fill="#f5f8fc" font-size="22" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">actual p9096 / g128 · C1 · n=5 median</text>
<text x="850" y="340" fill="#68a7ff" font-size="72" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">594.49</text>

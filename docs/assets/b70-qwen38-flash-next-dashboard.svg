<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-Flash-Next C1 llama.cpp SYCL dashboard on two Intel Arc Pro B70 GPUs</title>
<desc id="desc">Two separate C1 recipes. Fused FP32 8K context p512/g128 decode median 23.38 engine tok/s n=5. Fused F16 16K context actual p9096/g128 cold input median 594.49 engine tok/s n=5. c8 and c16 are context windows, not concurrency. Do not mix the two binaries as one recipe. Self-reported E2.</desc>
<rect width="1600" height="1180" fill="#07111f"/>
<text x="48" y="48" fill="#55d6be" font-size="16" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">QWEN3.8-FLASH-NEXT · 2× INTEL ARC PRO B70 · llama.cpp SYCL</text>
<text x="48" y="94" fill="#f5f8fc" font-size="34" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">C1 only · two binaries, two recipes</text>
<text x="48" y="128" fill="#9caec4" font-size="17" font-weight="400" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">c8 / c16 = context windows, not concurrency · 195 W configured cap · loaded-idle GPU1 pkg ~62 °C</text>
<rect x="1168" y="28" width="384" height="88" rx="18" fill="#0f1d30"/>
<text x="1360" y="64" fill="#55d6be" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">E2 SELF-REPORTED</text>
<text x="1360" y="94" fill="#9caec4" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">independent reproduction pending</text>
<rect x="48" y="164" width="736" height="430" rx="28" fill="#0f1d30"/>
<text x="82" y="206" fill="#55d6be" font-size="15" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">DECODE-FIRST · FUSED FP32 · 8K CONTEXT</text>
<text x="82" y="246" fill="#f5f8fc" font-size="22" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">p512 / g128 · C1 · n=5 median</text>
<text x="82" y="340" fill="#55d6be" font-size="72" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">23.38</text>

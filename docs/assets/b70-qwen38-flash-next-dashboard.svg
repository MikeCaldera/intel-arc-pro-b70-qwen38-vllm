<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">Qwen3.8-Flash-Next C1 leaders on two Intel Arc Pro B70 GPUs</title>
<desc id="desc">Two llama.cpp SYCL recipes. Fused FP32 8K context: 23.38 engine decode tok/s median n=5 at p512/g128. Fused F16 16K context: 594.49 engine cold-input tok/s median n=5 at actual p9096/g128. Single request. Self-reported.</desc>
<rect width="1600" height="720" fill="#07111f"/>
<text x="56" y="52" fill="#55d6be" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">QWEN3.8-FLASH-NEXT · 2× INTEL ARC PRO B70</text>
<text x="56" y="100" fill="#f5f8fc" font-size="34" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">llama.cpp SYCL · one request at a time</text>
<text x="56" y="136" fill="#9caec4" font-size="17" font-family="ui-sans-serif, system-ui, sans-serif">Community M64 GGUF · layer split · 195 W cap · n=5 medians</text>

<rect x="56" y="172" width="728" height="460" rx="28" fill="#0f1d30"/>
<text x="92" y="220" fill="#55d6be" font-size="14" font-weight="700" letter-spacing="1.2" font-family="ui-sans-serif, system-ui, sans-serif">DECODE RECIPE · FP32 · 8K CONTEXT</text>
<text x="92" y="338" fill="#55d6be" font-size="88" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">23.38</text>
<text x="92" y="392" fill="#9caec4" font-size="22" font-family="ui-sans-serif, system-ui, sans-serif">engine tok/s · p512 / g128</text>
<text x="92" y="444" fill="#f5f8fc" font-size="18" font-family="ui-sans-serif, system-ui, sans-serif">range 23.22–23.73 · cold input 184</text>
<text x="92" y="488" fill="#9caec4" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">GGML_SYCL_F16=OFF · -b 512 · q8_0 K / q4_1 V</text>
<text x="92" y="584" fill="#9caec4" font-size="15" font-family="ui-sans-serif, system-ui, sans-serif">timings.predicted_per_second · cache off</text>

<rect x="816" y="172" width="728" height="460" rx="28" fill="#0f1d30"/>
<text x="852" y="220" fill="#68a7ff" font-size="14" font-weight="700" letter-spacing="1.2" font-family="ui-sans-serif, system-ui, sans-serif">PREFILL RECIPE · F16 · 16K CONTEXT</text>
<text x="852" y="338" fill="#68a7ff" font-size="88" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">594.49</text>
<text x="852" y="392" fill="#9caec4" font-size="22" font-family="ui-sans-serif, system-ui, sans-serif">engine tok/s · actual p9096 / g128</text>
<text x="852" y="444" fill="#f5f8fc" font-size="18" font-family="ui-sans-serif, system-ui, sans-serif">range 594.11–595.45 · decode 20.34</text>
<text x="852" y="488" fill="#9caec4" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">GGML_SYCL_F16=ON · -b 3072 · q8_0 K / q4_1 V</text>
<text x="852" y="584" fill="#9caec4" font-size="15" font-family="ui-sans-serif, system-ui, sans-serif">timings.prompt_per_second · cache off</text>

<text x="800" y="688" fill="#64748b" font-size="14" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">Two compile-time binaries · F16 is not a runtime switch · self-reported, independent reproduction pending</text>
</svg>

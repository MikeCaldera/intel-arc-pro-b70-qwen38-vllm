<text x="82" y="710" fill="#f5f8fc" font-size="24" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">F16 is a compile-time flag · layer split, not tensor-parallel vLLM</text>
<rect x="82" y="748" width="700" height="250" rx="18" fill="#0b1829"/>
<text x="106" y="790" fill="#9caec4" font-size="16" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Artifact</text>
<text x="106" y="828" fill="#f5f8fc" font-size="18" font-weight="600" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">AtomicChat AD-4.27bpw M64</text>
<text x="106" y="860" fill="#9caec4" font-size="15" font-weight="500" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">IQ3_S gate/up · IQ4_NL down · Q5_1 PLE CPU</text>
<text x="106" y="892" fill="#9caec4" font-size="15" font-weight="500" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">88.03 GiB · no usable MTP</text>
<text x="106" y="924" fill="#9caec4" font-size="15" font-weight="500" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">llama.cpp 9723942 · IntelLLVM 2026.0.0</text>
<text x="106" y="956" fill="#9caec4" font-size="15" font-weight="500" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">t=1.0 / top_p=0.95 / top_k=20 · ignore_eos</text>
<rect x="818" y="748" width="700" height="250" rx="18" fill="#0b1829"/>
<text x="842" y="790" fill="#9caec4" font-size="16" font-weight="700" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Placement and power</text>
<text x="842" y="828" fill="#f5f8fc" font-size="18" font-weight="600" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">SYCL0+SYCL1 · split-mode layer 1,1</text>
<text x="842" y="860" fill="#9caec4" font-size="15" font-weight="500" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">CPU-attached x8+x8 · no GPU P2P · not vLLM TP2</text>
<text x="842" y="892" fill="#9caec4" font-size="15" font-weight="500" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">-np 1 · -t 6 -tb 14 · FA on · --no-cache-prompt</text>
<text x="842" y="924" fill="#9caec4" font-size="15" font-weight="500" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">draw ~97–99 / 108 W vs 195 W cap</text>
<text x="842" y="956" fill="#ffb45c" font-size="15" font-weight="600" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">not ordinary ≤55 °C cooldown</text>
<text x="800" y="1148" fill="#64748b" font-size="14" font-weight="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">Official-lab C1 n=5 · smoke B70-FLASH-OK / 703 / Paris · do not mix with Qwen3.8-27B vLLM numbers</text>

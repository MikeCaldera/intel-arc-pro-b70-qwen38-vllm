<text x="82" y="424" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">cold input on this server  183.98 tok/s</text>
<text x="82" y="460" fill="#9caec4" font-size="16" font-weight="500" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">GGML_SYCL_F16=OFF · -b/-ub 512 · q8_0/q4_1</text>
<text x="82" y="548" fill="#9caec4" font-size="15" font-weight="500" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">timings.predicted_per_second · cache_n=0</text>
